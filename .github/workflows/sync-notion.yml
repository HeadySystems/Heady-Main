# HEADY SYSTEMS :: Notion Knowledge Vault Sync
# Auto-syncs repo documentation changes to Notion
# Ref: Master Playbook A-3

name: Sync Notion Knowledge Vault

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'SYSTEM_ARCHITECTURE.md'
      - 'README_ECOSYSTEM.md'

  workflow_dispatch:

jobs:
  sync:
    name: "Sync to Notion"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed doc files
        id: changes
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD -- docs/ CHANGELOG.md README.md SYSTEM_ARCHITECTURE.md README_ECOSYSTEM.md 2>/dev/null || echo "")
          echo "changed_files=$FILES" >> $GITHUB_OUTPUT
          echo "has_changes=$( [ -n "$FILES" ] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: Update Notion Status Page
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_STATUS_PAGE_ID: ${{ secrets.NOTION_STATUS_PAGE_ID }}
        with:
          script: |
            const changedFiles = '${{ steps.changes.outputs.changed_files }}'.split('\n').filter(Boolean);
            const commitSha = context.sha.slice(0, 7);
            const timestamp = new Date().toISOString();

            const content = `📡 Auto-synced from commit ${commitSha} — ${timestamp}\n\nChanged files:\n${changedFiles.map(f => `• ${f}`).join('\n')}`;

            const response = await fetch(
              `https://api.notion.com/v1/blocks/${process.env.NOTION_STATUS_PAGE_ID}/children`,
              {
                method: 'PATCH',
                headers: {
                  'Authorization': `Bearer ${process.env.NOTION_API_KEY}`,
                  'Content-Type': 'application/json',
                  'Notion-Version': '2022-06-28',
                },
                body: JSON.stringify({
                  children: [{
                    type: 'callout',
                    callout: {
                      icon: { type: 'emoji', emoji: '🔄' },
                      rich_text: [{
                        type: 'text',
                        text: { content }
                      }]
                    }
                  }]
                })
              }
            );

            if (!response.ok) {
              const err = await response.text();
              core.warning(`Notion sync failed: ${err}`);
            } else {
              core.info(`Notion updated with ${changedFiles.length} changed files`);
            }
