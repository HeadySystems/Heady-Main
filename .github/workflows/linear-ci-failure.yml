# Reusable step: create a Linear issue when a CI job fails
# Usage: add as the last step in any job with `if: failure()`
#
# Required secret: LINEAR_API_KEY
# Configured for team HEA (HeadySystems)

name: Create Linear Issue on CI Failure

on:
  workflow_call:
    secrets:
      LINEAR_API_KEY:
        required: true

jobs:
  create-issue:
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Create Linear issue
        uses: ctriolo/action-create-linear-issue@v1
        with:
          linear-api-key: ${{ secrets.LINEAR_API_KEY }}
          linear-team-key: "HEA"
          linear-issue-title: "CI failure: ${{ github.workflow }} on ${{ github.ref_name }}"
          linear-issue-description: |
            ## CI Pipeline Failure

            | Field | Value |
            |-------|-------|
            | **Pipeline** | ${{ github.workflow }} |
            | **Branch** | `${{ github.ref_name }}` |
            | **Commit** | `${{ github.sha }}` |
            | **Actor** | @${{ github.actor }} |
            | **Timestamp** | ${{ github.event.head_commit.timestamp }} |

            **Run URL**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ---
            _Auto-created by HeadySync CI integration_
          linear-attachment-url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
