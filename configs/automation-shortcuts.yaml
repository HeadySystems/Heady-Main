# HEADY SYSTEMS :: Automation Triggers
# Ref: Command Shortcut Reference v1.0.0 §11.5

triggers:
  - event: commit
    branch: main
    command: dev:sync

  - schedule: "0 7 * * *"
    command: workflow:morning

  - schedule: "0 2 * * *"
    command: workflow:nightly

  - event: deployment
    environment: production
    command: workflow:post-deploy

  - event: alert
    type: budget_warning
    command: sos:budget

  - event: alert
    type: security_breach
    command: sos:security

  - event: alert
    type: service_down
    command: sos:down

  - schedule: "0 0 * * 0"
    command: workflow:ip-protect

  - schedule: "0 3 * * 1"
    command: workflow:memory-overhaul

  - schedule: "0 4 * * 3"
    command: workflow:security-full

  - schedule: "0 5 1 * *"
    command: workflow:provider-rebalance
