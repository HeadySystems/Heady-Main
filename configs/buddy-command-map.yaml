# HEADY SYSTEMS :: HeadyBuddy NLP → Command Mapping
# Ref: Command Shortcut Reference v1.0.0 §11.4

patterns:
  - match: ["system status", "how's the system", "health check", "status report"]
    command: sys:status

  - match: ["search memory", "find in memory", "recall", "remember"]
    command: mem:search

  - match: ["deploy", "ship it", "push to prod", "release"]
    command: deploy:canary

  - match: ["what's broken", "any errors", "error report", "show errors"]
    command: obs:errors

  - match: ["security scan", "are we secure", "vulnerability check", "audit security"]
    command: sec:scan

  - match: ["morning check", "start my day", "boot up", "good morning"]
    command: workflow:morning

  - match: ["emergency", "system down", "help", "everything broken", "sos"]
    command: sos:down

  - match: ["run pipeline", "process this", "full pipeline"]
    command: pipe:run

  - match: ["quick pipeline", "fast mode", "quick analysis"]
    command: pipe:fast

  - match: ["how much is it costing", "budget", "spending", "costs"]
    command: sys:budget

  - match: ["train", "learn", "optimize", "improve"]
    command: dev:train

  - match: ["run tests", "test everything", "check quality"]
    command: dev:test

  - match: ["check domains", "site status", "are sites up"]
    command: site:status

  - match: ["rotate secrets", "change passwords", "new api keys"]
    command: sec:rotate

  - match: ["battle", "compare models", "which AI is better"]
    command: ai:battle

  - match: ["spawn bees", "launch swarm", "agents go"]
    command: bee:spawn

  - match: ["sync repos", "push everywhere", "sync git"]
    command: git:sync

  - match: ["patent check", "prior art", "ip search"]
    command: ip:scan

  - match: ["investor prep", "fundraise", "pitch ready"]
    command: workflow:investor-prep
