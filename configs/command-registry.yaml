      - tool: system_status
      - tool: hcfp_status
      - tool: telemetry
    timeout_ms: 29034
    csl_confidence: 0.718
    tags: [system, health, monitoring]

  sys:health:
    name: "Domain Health Check"
    category: system
    description: "Hit all 11 domain /health endpoints, return composite pass/fail"
    steps:
      - tool: health
        params:
          domains: [headyme.com, headysystems.com, heady-ai.com, headyconnection.org, headymcp.com, headyio.com, headybuddy.org, headybot.com, headyapi.com, headybuddy.com, headylens.com]
