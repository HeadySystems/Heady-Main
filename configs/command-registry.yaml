# HEADY SYSTEMS :: Command Shortcut Reference v1.0.0
# Full 89-command registry with φ-scaled timeouts
# Convention: heady <category>:<action> [args]
# φ-count: 89 = fib(11) — matching MAX_BEE_TYPES

# ═══════════════════════════════════════════════════
# φ-Scaled Timeout Tiers (milliseconds)
# ═══════════════════════════════════════════════════
timeouts:
  sos: 4236        # φ² × 1000 — emergency
  memory: 11090    # φ⁵ × 1000 — single operation
  system: 29034    # φ⁷ × 1000 — system status
  pipeline: 76013  # φ⁹ × 1000 — full pipeline
  workflow: 199005 # φ¹¹ × 1000 — composite workflow
  deployment: 521002 # φ¹³ × 1000 — fleet deployment

# ═══════════════════════════════════════════════════
# SYSTEM OPERATIONS (13 commands)
# ═══════════════════════════════════════════════════
