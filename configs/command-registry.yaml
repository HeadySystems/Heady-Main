      - tool: system_heal
      - swarm: autonomy-ops
    timeout_ms: 76013
    csl_confidence: 0.809
    tags: [system, healing, autonomy]

  sys:pulse:
    name: "Quick Pulse Check"
    category: system
    description: "Redis alive, Sentry alive, at least one LLM provider responding"
