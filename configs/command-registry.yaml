    csl_confidence: 0.618
    tags: [system, health, quick]

  sys:boot:
    name: "Cold Boot"
    category: system
    description: "10-phase heady-manager.js bootstrap sequence"
    steps:
      - tool: system_boot
        params: { phases: 10 }
    timeout_ms: 76013
    csl_confidence: 0.927
    tags: [system, boot, startup]

  sys:shutdown:
    name: "Graceful Shutdown"
    category: system
    description: "φ-scaled graceful shutdown (drain → flush → close)"
    steps:
      - tool: system_shutdown
        params: { drain_timeout_ms: 4236 }
    timeout_ms: 11090
    csl_confidence: 0.927
    tags: [system, shutdown]

  sys:budget:
