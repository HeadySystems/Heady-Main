# HEADY SYSTEMS :: Composite Workflows (21 = fib(8))
# Ref: Command Shortcut Reference v1.0.0 §9

workflows:
  # Daily
  workflow:morning:
    name: "Morning Boot"
    steps: [sys:pulse, sys:health, obs:errors, mem:bootstrap, dev:train]
    estimate_min: 5

  workflow:nightly:
    name: "Nightly Maintenance"
    steps: [mem:compact, mem:migrate, sec:scan, git:clean, obs:metrics]
    estimate_min: 15

  workflow:pre-deploy:
    name: "Pre-Deploy Check"
    steps: [dev:test, sec:deps, sec:headers, sys:drift, sys:bench]
    estimate_min: 10

  workflow:post-deploy:
    name: "Post-Deploy Verify"
    steps: [deploy:verify, sys:health, obs:traces, site:status]
    estimate_min: 3

  # Development
  workflow:feature:
    name: "Feature Start"
    steps: [ai:research, ip:novel, dev:scaffold, mem:store]
    estimate_min: 5

  workflow:review:
    name: "Code Review"
    swarm: code-review
    steps: [sec:scan, ai:eval, pipe:metacog]
    estimate_min: 8

  workflow:release:
    name: "Release Cut"
    steps: [dev:test, dev:build, git:sync, deploy:canary, workflow:post-deploy]
    estimate_min: 20

  workflow:hotfix:
    name: "Hotfix"
    steps: [deploy:rollback, dev:fix, dev:test, deploy:canary]
    estimate_min: 10

  # Intelligence
  workflow:deep-analyze:
    name: "Deep Analysis"
    steps: [ai:analyze, pipe:metacog, ai:battle, mem:store]
    estimate_min: 10

  workflow:competitive:
    name: "Competitive Intel"
    swarm: competitive-intel
    steps: [ai:research, mem:store, dev:docs]
    estimate_min: 15

  workflow:patent-discover:
    name: "Patent Discovery"
    skill: imagination_engine
    steps: [ip:scan, ip:novel, ip:file]
    estimate_min: 30

  # Security
  workflow:security-full:
    name: "Full Security Sweep"
    steps: [sec:scan, sec:secrets, sec:deps, sec:headers, sec:mcp, sec:waf]
    estimate_min: 20

  workflow:rotate-secrets:
    name: "Secret Rotation"
    steps: [sec:rotate, deploy:all, sys:health, sec:secrets]
    estimate_min: 15

  workflow:incident:
    name: "Incident Response"
    swarm: incident-response
    steps: [obs:traces, obs:errors, sys:heal]
    estimate_min: 5

  # Infrastructure
  workflow:fleet-deploy:
    name: "Full Fleet Deploy"
    steps: [workflow:pre-deploy, deploy:all, deploy:sites, workflow:post-deploy]
    estimate_min: 30

  workflow:memory-overhaul:
    name: "Memory Overhaul"
    steps: [mem:stats, mem:compact, mem:flush, mem:migrate, mem:stats]
    estimate_min: 10

  workflow:provider-rebalance:
    name: "Provider Rebalance"
    steps: [ai:route, ai:cost, swarm:optimize, ai:route]
    estimate_min: 5

  # Founder-Critical
  workflow:investor-prep:
    name: "Investor Prep"
    steps: [sys:inventory, sys:bench, ip:calendar, workflow:competitive, dev:docs]
    estimate_min: 45

  workflow:fundraise-snapshot:
    name: "Fundraise Snapshot"
    steps: [sys:budget, sys:versions, site:analytics, obs:metrics]
    estimate_min: 5

  workflow:ip-protect:
    name: "IP Protection Sweep"
    steps: [ip:calendar, ip:map, sec:mcp, ip:scan]
    estimate_min: 15
